<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BiliAnalytics{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/custom.css">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#0a0a1a] text-white overflow-x-hidden" style="font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif;">
    <div id="particles-js" class="fixed inset-0 z-0 pointer-events-none"></div>
    <div class="relative z-10 flex min-h-screen">
        {% block sidebar %}
        {% include 'sidebar.html' %}
        {% endblock %}
        <main class="flex-1 ml-60 p-6 transition-all duration-700 ease-[cubic-bezier(0.32,0.72,0,1)]" id="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="/static/js/main.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
